    <path d="M29 13 V55 M29 30 L18 20 M29 39 L41 27" fill="none" stroke="#123e31" stroke-width="2.7" stroke-linecap="round"/>
    <text x="67" y="46" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="54" letter-spacing="-2" fill="#103a2f">saans</text>
    <text x="2" y="88" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3.6" fill="#36584a">CLEANER AIR  •  SAFER DAYS  •  BRIGHTER SCHOOLS</text>
  </g>
  <g transform="translate(1090 42)">
    <rect width="438" height="48" rx="24" fill="#d9e9dc"/>
    <circle cx="25" cy="24" r="13" fill="#23774d"/>
    <path d="M25 14 L25 34 M25 24 L19 19 M25 28 L31 21" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#143d30">Built for Environmental Hacks 2026</text>
    <text x="17" y="77" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#61786e">People  •  Schools  •  Cleaner Tomorrows</text>
  </g>

  <!-- Headline -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#15252d">
    <text x="76" y="225" font-size="64" letter-spacing="-2.4">Turning air-quality data</text>
    <text x="76" y="295" font-size="64" letter-spacing="-2.4">into better decisions</text>
    <text x="76" y="365" font-size="64" letter-spacing="-2.4">for <tspan fill="#24845a">schools.</tspan></text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5b6c72">
    <text x="80" y="415">Saans helps school leaders translate air-quality</text>
    <text x="80" y="446">forecasts into practical activity decisions, so</text>
    <text x="80" y="477">students can enjoy safer, healthier school days.</text>
  </g>
