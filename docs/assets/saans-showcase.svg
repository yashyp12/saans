    <use href="#leaf" transform="translate(1555 65) rotate(30) scale(1.12)"/>
    <use href="#leaf" transform="translate(22 780) rotate(-55) scale(1.35)"/>
    <use href="#leaf" transform="translate(1570 785) rotate(45) scale(1.45)"/>
