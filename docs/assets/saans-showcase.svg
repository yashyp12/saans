<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Saans — air-quality decisions for schools</title>
  <desc id="desc">A cream and forest-green showcase illustration with a school air-quality dashboard, activity timeline, forecast chart, and safer-time-window panel.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#edf3e9"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174739"/><stop offset="1" stop-color="#092d25"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef9"/><stop offset="1" stop-color="#f3f3e9"/>
    </linearGradient>
    <linearGradient id="pollution" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef9637" stop-opacity=".34"/><stop offset="1" stop-color="#ef9637" stop-opacity=".02"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#14382d" flood-opacity=".14"/>
    </filter>
    <g id="leaf">
      <path d="M0 0 C-27 -18 -27 -50 0 -72 C27 -51 29 -19 0 0Z" fill="#8caf99" fill-opacity=".6" stroke="#477b60" stroke-width="2"/>
      <path d="M0 -3 V-59 M0 -28 L-13 -41 M0 -39 L13 -52" fill="none" stroke="#477b60" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="tier-dot"><circle r="6" fill="currentColor"/></g>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <circle cx="1490" cy="170" r="220" fill="#dcece0" opacity=".48"/>
  <circle cx="110" cy="680" r="190" fill="#e4eee1" opacity=".7"/>
  <g opacity=".7">
