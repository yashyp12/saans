    <path d="M750 238 H1517" stroke="#e0e5da"/>
    <text x="774" y="223" fill="#123d30" font-family="Georgia,serif" font-weight="700" font-size="18">saans</text>
    <text x="840" y="216" fill="#6a7d70" font-size="8" font-weight="700" letter-spacing=".7">PRINCIPAL BRIEFING</text>
    <text x="840" y="228" fill="#3f554d" font-size="10">Today · School activity plan</text>
