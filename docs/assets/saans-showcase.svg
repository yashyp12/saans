      <text x="1183" y="507" fill="#6d7c73" font-size="10">Shorten or use an indoor alternative.</text>
      <text x="1162" y="528" fill="#31483c" font-weight="700">11:00</text><circle cx="1170" cy="524" r="4" fill="#e67827"/>
      <text x="1183" y="528" fill="#17272e" font-weight="700">Physical training</text><rect x="1301" y="515" width="39" height="18" rx="9" fill="#ffeadc"/><text x="1320" y="527" text-anchor="middle" fill="#a14e1e" font-size="9" font-weight="700">MOVE</text>
      <text x="1183" y="542" fill="#6d7c73" font-size="10">Use a safer school-day window.</text>
      <text x="1162" y="563" fill="#31483c" font-weight="700">14:30</text><circle cx="1170" cy="559" r="4" fill="#24875a"/>
      <text x="1183" y="563" fill="#17272e" font-weight="700">Dispersal</text><rect x="1240" y="550" width="28" height="18" rx="9" fill="#e3f3e8"/><text x="1254" y="562" text-anchor="middle" fill="#226f49" font-size="9" font-weight="700">GO</text>
      <text x="1183" y="577" fill="#6d7c73" font-size="10">Example guidance, not medical advice.</text>
    </g>
  </g>

