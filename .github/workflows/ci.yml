name: Saans CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saans-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed app areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend_api: ${{ steps.filter.outputs.backend_api }}
      backend_ingest: ${{ steps.filter.outputs.backend_ingest }}
    steps:
      - name: Check out source history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set_output() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             [ -z "$BASE_SHA" ] || \
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            set_output frontend true
            set_output backend_api true
            set_output backend_ingest true
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

          if grep -Eq '^frontend/' changed-files.txt; then
            set_output frontend true
          else
            set_output frontend false
          fi

          if grep -Eq '^(backend/src/api/|backend/src/core/|backend/src/data_access\.py$|backend/requirements\.txt$|backend/src/__init__\.py$|backend/src/[^/]+\.py$)' changed-files.txt; then
            set_output backend_api true
          else
            set_output backend_api false
          fi

          if grep -Eq '^(backend/src/ingest/|backend/src/core/|backend/src/data_access\.py$|backend/requirements\.txt$|backend/src/__init__\.py$|backend/src/[^/]+\.py$)' changed-files.txt; then
            set_output backend_ingest true
          else
            set_output backend_ingest false
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://m23og9ihef.execute-api.ap-south-1.amazonaws.com' }}
        run: npm run build

      - name: Save frontend build
        uses: actions/upload-artifact@v7
        with:
          name: saans-frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  sam-validation-build:
    name: Validate SAM and build Lambda packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Validate SAM template
        run: sam validate --template-file template.yaml --region ap-south-1

      - name: Build Lambda packages
        run: sam build --template-file template.yaml --region ap-south-1

      - name: Create Lambda ZIP packages
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          packages = {
              "api.zip": Path(".aws-sam/build/ApiFunction"),
              "ingest.zip": Path(".aws-sam/build/IngestFunction"),
          }

          output_dir = Path("deploy-packages")
          output_dir.mkdir(exist_ok=True)

          for archive_name, source_dir in packages.items():
              if not source_dir.is_dir():
                  raise SystemExit(f"Missing SAM build directory: {source_dir}")

              archive = output_dir / archive_name

              with ZipFile(archive, "w", ZIP_DEFLATED) as zf:
                  for file in source_dir.rglob("*"):
                      if file.is_file():
                          zf.write(file, file.relative_to(source_dir).as_posix())

              size = archive.stat().st_size
              if size >= 50_000_000:
                  raise SystemExit(
                      f"{archive} is too large for direct Lambda ZIP upload."
                  )

              print(f"Created {archive}: {size:,} bytes")
          PY

      - name: Save Lambda packages
        uses: actions/upload-artifact@v7
        with:
          name: saans-lambda-packages
          path: deploy-packages/*.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy Saans to AWS
    needs:
      - changes
      - backend-tests
      - frontend-build
      - sam-validation-build

    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        vars.AWS_DEPLOY_ROLE_ARN != '' &&
        (
          (needs.changes.outputs.frontend == 'true' &&
            vars.AWS_FRONTEND_BUCKET != '' &&
            vars.CLOUDFRONT_DISTRIBUTION_ID != '') ||
          (needs.changes.outputs.backend_api == 'true' &&
            vars.AWS_API_FUNCTION_NAME != '') ||
          (needs.changes.outputs.backend_ingest == 'true' &&
            vars.AWS_INGEST_FUNCTION_NAME != '')
        )
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_API_FUNCTION_NAME: ${{ vars.AWS_API_FUNCTION_NAME }}
      AWS_INGEST_FUNCTION_NAME: ${{ vars.AWS_INGEST_FUNCTION_NAME }}
      AWS_FRONTEND_DOMAIN: ${{ vars.AWS_FRONTEND_DOMAIN || 'd1rvgy019uvbns.cloudfront.net' }}
      API_BASE: ${{ vars.VITE_API_BASE || 'https://m23og9ihef.execute-api.ap-south-1.amazonaws.com' }}

    steps:
      - name: Download frontend build
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v8
        with:
          name: saans-frontend-dist
          path: frontend/dist/

      - name: Download Lambda packages
        if: needs.changes.outputs.backend_api == 'true' || needs.changes.outputs.backend_ingest == 'true'
        uses: actions/download-artifact@v8
        with:
          name: saans-lambda-packages
          path: deploy-packages/

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          allowed-account-ids: "089781651236"
          role-session-name: saans-github-actions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy API Lambda code
        if: needs.changes.outputs.backend_api == 'true'
        run: |
          aws lambda update-function-code \
            --function-name "$AWS_API_FUNCTION_NAME" \
            --zip-file fileb://deploy-packages/api.zip \
            --region "$AWS_REGION"

          aws lambda wait function-updated-v2 \
            --function-name "$AWS_API_FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Deploy ingestion Lambda code
        if: needs.changes.outputs.backend_ingest == 'true'
        run: |
          aws lambda update-function-code \
            --function-name "$AWS_INGEST_FUNCTION_NAME" \
            --zip-file fileb://deploy-packages/ingest.zip \
            --region "$AWS_REGION"

          aws lambda wait function-updated-v2 \
            --function-name "$AWS_INGEST_FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Upload frontend to S3
        if: needs.changes.outputs.frontend == 'true'
        run: |
          aws s3 sync frontend/dist/ \
            "s3://${AWS_FRONTEND_BUCKET}/" \
            --region "$AWS_REGION"

      - name: Invalidate website entry points
        if: needs.changes.outputs.frontend == 'true'
        id: invalidate
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/" "/index.html" "/favicon.svg" \
            --query "Invalidation.Id" \
            --output text)"

          echo "id=${INVALIDATION_ID}" >> "$GITHUB_OUTPUT"
          echo "Created invalidation: ${INVALIDATION_ID}"

      - name: Wait for CloudFront invalidation
        if: needs.changes.outputs.frontend == 'true'
        env:
          INVALIDATION_ID: ${{ steps.invalidate.outputs.id }}
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Smoke-test the website
        if: needs.changes.outputs.frontend == 'true'
        run: |
          curl --fail --silent --show-error \
            "https://${AWS_FRONTEND_DOMAIN}/" --output /dev/null

          curl --fail --silent --show-error \
            "https://${AWS_FRONTEND_DOMAIN}/favicon.svg" --output /dev/null

          echo "Website and favicon returned successful HTTP responses."

      - name: Smoke-test the API
        if: needs.changes.outputs.backend_api == 'true'
        run: |
          curl --fail --silent --show-error \
            "${API_BASE}/schools" --output /dev/null

          echo "API returned a successful HTTP response."
