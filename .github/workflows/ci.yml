name : Saans CI/CD

## on > define the events that will trigger the workflow. 
## In this case, the workflow will be triggered on pull requests to the main branch, pushes to the main branch, and manual triggers via workflow_dispatch.
on:
  pull_request:
    branches: [main]
  
  push:
    branches: [main]
  workflow_dispatch:

permissions:
    contents: read

concurrency:
  group: saans-ci-cd-${{ github.ref }}
  cancel-in-progress: true








jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v7

          - name: Show a success message
            run: echo "My first github actions workflow is running "

          - name: List repo files
            run: ls -al
